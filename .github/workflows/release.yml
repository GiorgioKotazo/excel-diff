name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: excel-diff-linux-x64
          - os: windows-latest
            artifact: excel-diff-windows-x64.exe
          - os: macos-latest
            artifact: excel-diff-macos-x64
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --release
      - name: Rename binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv target/release/excel-diff.exe target/release/${{ matrix.artifact }}
          else
            mv target/release/excel-diff target/release/${{ matrix.artifact }}
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - run: ls -R artifacts
      - uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
